# Auto sidecar beside Qwen3-VL GRPO: transfer vs connection
dump_dir: curriculum/outputs/coevolve_vla_auto/ares_rollouts
logdir: curriculum/outputs/coevolve_vla_auto
toy_wm_ckpt: curriculum/outputs/toy_wm0.pt
wm_ckpt: curriculum/outputs/coevolve_vla_auto/wm_student_latest.pt
device: auto
num_frame_per_block: 3
max_steps: 20
max_eps_per_step: 8
probe_n: 12
hyp_topk: 10
pass_thresh: 0.35
wm_lr: 1.0e-4
weight_decay: 0.01
wm_reward_lambda: 0.5
transfer_lambda: 0.5
slot_lambda: 0.3
lambda_ic: 0.3
lambda_mem: 0.2
connection_beta: 0.7
# DiaWM: VLA as probe policy (r_probe = uncert + gap + abstain)
probe_mode: true
probe_alpha: 0.55
worth_lambda_cost: 0.15
worth_skip_thresh: 0.18
worth_learn_thresh: 0.28
mastered_min_verify: 2
mastered_min_conf: 0.50
reverify_every: 4
memory_merge_thresh: 0.85
memory_max_items: 5000
memory_min_confidence: 0.35
poll_s: 8.0
wait_dump: false
