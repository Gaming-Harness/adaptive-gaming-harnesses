# Short E2E: real HF VLA + MineStudio sandbox + ActionProjection + toy WM
# Run:
#   cd project_root
#   PYTHONPATH=../../ares:$PYTHONPATH \
#     python -m curriculum.coevolve_vla \
#     --config curriculum/configs/coevolve_vla_smoke2.yaml

vla_model_path: /path/to/vla_checkpoint
vla_mode: hf
vla_device: cuda
vla_dtype: bfloat16
max_new_tokens: 128
instruction: "Explore and progress the Minecraft task."

use_sandbox: true
minestudio_endpoint: https://model.example.com/sandboxGateway/system/714
task_dir: /path/to/openha_tasks
# stub latent first (faster / lower VRAM); set true once smoke passes
encode_vae: false
pretrained_model_path: pretrained_wm
vae_dtype: float16

data_root: data/mc_vpt_long45
max_clips: 4
num_frame_per_block: 3
block_stride: 2
expert_ratio: 0.5

toy_wm_ckpt: curriculum/outputs/toy_wm0.pt
action_proj_ckpt: curriculum/outputs/action_projection.pt
wm_lr: 1.0e-4
proj_lr: 1.0e-4
train_action_proj: true
lambda_sd: 1.0
lambda_expert: 0.5
ema_tau: 0.99
weight_decay: 0.01
max_grad_norm: 1.0
batch_size: 8

max_turns: 8
max_steps: 2
collect_n: 4
log_interval: 1
save_interval: 1
device: auto
logdir: curriculum/outputs/coevolve_vla_smoke2
