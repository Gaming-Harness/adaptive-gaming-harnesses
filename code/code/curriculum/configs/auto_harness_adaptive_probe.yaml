# Offline example: frozen stub VLA + adaptive contextual probing.
seed: 0
logdir: curriculum/outputs/auto_harness_adaptive_probe
n_rounds: 12
n_eval_episodes: 6
accept_eps: 0.01
start: strong
backend: stub
vla_mode: stub

probe_enabled: true
probe_selection_strategy: ucb
probe_action_pool: [forward, back, left, right, turn_left, turn_right, attack, forward_attack, noop]
probe_budget: 4
probe_every_n: 3
probe_on_fail: true
probe_on_stall: true
probe_stall_steps: 8
probe_ucb_c: 1.2
probe_transfer_weight: 0.25
probe_downstream_success_reward: 1.0
probe_downstream_discount: 0.8
probe_bandit_state_path: curriculum/outputs/auto_harness_adaptive_probe/probe_bandit.json
