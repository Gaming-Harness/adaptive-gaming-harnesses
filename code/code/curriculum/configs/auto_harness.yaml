# Training-free Auto Harness Search (frozen VLA)
# Usage:
#   # local stub (no API)
#   python -m curriculum.auto_harness_search --config curriculum/configs/auto_harness.yaml
#   # live MineStudio + stub VLA (needs MINESTUDIO_TOKEN)
#   python -m curriculum.auto_harness_search --config curriculum/configs/auto_harness_minestudio.yaml
#   # live MineStudio + Qwen hf (GPU)
#   backend: minestudio / vla_mode: hf

seed: 0
logdir: curriculum/outputs/auto_harness
n_rounds: 12
n_eval_episodes: 6
accept_eps: 0.01
start: degraded   # degraded | strong | path/to/harness.json
backend: stub     # stub | minestudio
vla_mode: stub    # stub | hf
# MineStudio extras (used when backend=minestudio)
ticks_per_action: 4
task_config: ""
img_save_dir: curriculum/outputs/harness_sandbox_images
success_reward_thresh: 0.5
soft_rollback: true
