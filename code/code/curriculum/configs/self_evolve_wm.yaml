# Self-evolving World Model — sandbox-grounded (WM-only, no VLA)
# ---------------------------------------------------------------
# Loop: Sandbox interact → F_φ → Intervention Probe → Knowledge → Selective Update
#
# sandbox_backend:
#   stub       — offline unit test (no network)
#   minestudio — MineStudio gateway (same as coevolve_vla)
#   llm_api     — MineRL seed-reset (true counterfactual fork)

wm_backend: toy
toy_wm_ckpt: curriculum/outputs/toy_wm0.pt
memory_init: null

# offline warm-start (optional; sandbox will keep adding expert)
data_root: data/mc_vpt_train
max_clips: 20
num_frame_per_block: 3
block_stride: 1

device: auto

# --- sandbox ---
use_sandbox: true
sandbox_backend: minestudio   # change to llm_api for seed-fork interventions
latent_encoder: cheap         # cheap | vae
pretrained_model_path: pretrained_wm
vae_dtype: float16
minestudio_endpoint: https://model.example.com/sandboxGateway/system/714
task_dir: /path/to/openha_tasks
sandbox_max_turns: 8
ticks_per_action: 4
collect_every: 1
llm_api_env_id: MineRLBasaltFindCave-v0
llm_api_prefix_turns: 2
seed_start: 0
render_size: [640, 360]
max_interventions: 512
probe_interventions: 16
intervene_batch: 8

# probes
probe_every: 1
probe_n: 16
probe_horizon: 3
n_intervene: 3
transfer_pairs: 16
max_chains: 16
train_chains: 8
fail_thresh: 0.45
pass_thresh: 0.40          # probe pass → compress into experience
discover_topk: 8
under_explore_bonus: 0.3
causal_margin: 0.01

# knowledge memory
memory_merge_thresh: 0.85
memory_max_items: 5000
memory_min_confidence: 0.40

# replay / training
expert_ratio: 0.7
batch_size: 32
wm_lr: 1.0e-4
weight_decay: 0.01
max_grad_norm: 1.0
ema_tau: 0.99

lambda_causal: 0.5
lambda_intervene: 0.5
lambda_horizon: 0.3
lambda_memory: 0.2
lambda_anchor: 0.1

max_steps: 50
log_interval: 1
save_interval: 10
eval_n: 32
logdir: curriculum/outputs/self_evolve_wm_sandbox
