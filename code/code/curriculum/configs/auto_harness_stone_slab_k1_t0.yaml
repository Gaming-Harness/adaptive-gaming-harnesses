# K=1 + greedy VLA. Half-success case under K=2 should become clearer binary under K=1.
seed: 0
logdir: curriculum/outputs/auto_harness_stone_slab_k1_t0
n_rounds: 3
n_eval_episodes: 1
eval_seeds: [101]
holdout_seeds: [909]
accept_eps: 0.01
start: strong
backend: minestudio
vla_mode: hf
vla_model_path: /path/to/vla_checkpoint
vla_device: cuda
vla_dtype: bfloat16
vla_temperature: 0.0
vla_do_sample: false
action_chunk_len: 4
max_steps: 100
ticks_per_action: 4
checkpoint_every: 8
recover_max_retries: 2

probe_enabled: true
memory_enabled: true
verify_enabled: false
recover_enabled: true
prefer_memory_action: false
probe_budget: 8
probe_every_n: 4
probe_action_pool:
  - forward
  - attack
  - forward_attack
  - turn_left
  - look_up

proposer_mode: llm
proposer_model: gemini-2.5-flash
proposer_temperature: 0.0
prefer_components:
  - probe
  - recover

task_config: /path/to/openha_eval/tasks/0003_mine_block_stone_slab.json
img_save_dir: curriculum/outputs/harness_sandbox_images_stone_slab_k1_t0
success_reward_thresh: 0.5
soft_rollback: true
