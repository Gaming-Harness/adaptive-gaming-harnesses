# Ablation: seed harness (probe + memory + recover; verify off).
# Same seeds as bare arm. n_rounds=0 → eval only (no LLM search).

seed: 0
logdir: curriculum/outputs/ablation_harness_k2
n_rounds: 0
n_eval_episodes: 2
eval_seeds: [101, 202]
holdout_seeds: [909]
accept_eps: 0.01
start: strong
backend: minestudio
vla_mode: hf
vla_model_path: /path/to/vla_checkpoint
vla_device: cuda
vla_dtype: bfloat16
action_chunk_len: 4
max_steps: 100
ticks_per_action: 4
checkpoint_every: 8
recover_max_retries: 2

probe_enabled: true
memory_enabled: true
verify_enabled: false
recover_enabled: true
prefer_memory_action: false
probe_budget: 8
probe_every_n: 4
probe_action_pool:
  - forward
  - attack
  - forward_attack
  - turn_left
  - look_up

proposer_mode: random

task_config: /path/to/openha_eval/tasks/0007_mine_block_peony.json
img_save_dir: curriculum/outputs/harness_sandbox_images_ablation_harness_k2
success_reward_thresh: 0.5
soft_rollback: true
