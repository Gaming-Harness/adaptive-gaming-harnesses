# Auto-Harness: collaborator_a GRPO-400 frozen VLA + LLMAPI LLM proposer + MineStudio
# Core: Frozen VLA + Auto-Harness + Sandbox. LLM proposes, sandbox judges.
#
#   cd project_root
#   python -m curriculum.auto_harness_search \
#     --config curriculum/configs/auto_harness_minestudio_hf_rl.yaml
#
# Paired J(H): H and H' share eval_seeds. ACCEPT iff mean_i Δ_i >= accept_eps.
# K=2 first loop: eval 101/202, holdout 909.

seed: 0
logdir: curriculum/outputs/auto_harness_rl400_paired_k2
n_rounds: 3
n_eval_episodes: 2
eval_seeds: [101, 202]
holdout_seeds: [909]
accept_eps: 0.01
start: strong
backend: minestudio
vla_mode: hf
vla_model_path: /path/to/vla_checkpoint
vla_device: cuda
vla_dtype: bfloat16
action_chunk_len: 4
max_steps: 100
ticks_per_action: 4
checkpoint_every: 8
recover_max_retries: 2

# Let VLA act; LLM may later turn verify/probe knobs on
probe_enabled: true
verify_enabled: false
prefer_memory_action: false
probe_budget: 8
probe_every_n: 4
probe_action_pool:
  - forward
  - attack
  - forward_attack
  - turn_left
  - look_up

proposer_mode: llm
proposer_model: gemini-2.5-flash
mutation_components:
  - probe
  - memory
  - recover
  - verify
prefer_components:
  - probe
  - recover

task_config: /path/to/openha_eval/tasks/0007_mine_block_peony.json
img_save_dir: curriculum/outputs/harness_sandbox_images_rl400_paired_k2
success_reward_thresh: 0.5
soft_rollback: true
