# Stub plumbing test — no sandbox token, no 8B load
vla_model_path: /path/to/vla_checkpoint
vla_mode: stub
use_sandbox: false
encode_vae: false
pretrained_model_path: pretrained_wm

data_root: data/mc_vpt_long45
max_clips: 6
num_frame_per_block: 3
block_stride: 2
expert_ratio: 0.5

toy_wm_ckpt: curriculum/outputs/toy_wm0.pt
wm_lr: 1.0e-4
lambda_sd: 1.0
lambda_expert: 0.5
ema_tau: 0.99
weight_decay: 0.01
max_grad_norm: 1.0
batch_size: 16

max_turns: 5
max_steps: 20
collect_n: 8
log_interval: 5
save_interval: 10
device: auto
logdir: curriculum/outputs/coevolve_vla_stub
