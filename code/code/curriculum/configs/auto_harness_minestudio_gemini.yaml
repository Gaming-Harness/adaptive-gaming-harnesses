# Live MineStudio + Gemini Flash via an OpenAI-compatible LLM gateway.
# Set LLM_API_APP_ID before running.
#
#   cd project_root
#   python -m curriculum.auto_harness_search --ping-llm
#   python -m curriculum.auto_harness_search \
#     --config curriculum/configs/auto_harness_minestudio_gemini.yaml

seed: 0
logdir: curriculum/outputs/auto_harness_minestudio_gemini
n_rounds: 3
n_eval_episodes: 1
accept_eps: 0.01
start: strong
backend: minestudio
vla_mode: gemini-flash
vla_model_path: gemini-2.5-flash
gemini_temperature: 0.4
action_chunk_len: 4
max_steps: 12
ticks_per_action: 4
task_config: /path/to/openha_tasks/0000_mine_block_oak_log.json
img_save_dir: curriculum/outputs/harness_sandbox_images
success_reward_thresh: 0.5
soft_rollback: true
