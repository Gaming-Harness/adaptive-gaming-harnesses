# Probe-focused AutoHarness + Gemini Flash (LLMAPI) + MineStudio
# Deepens probing direction: attack/forward_attack pools, denser budgets.
#
#   cd project_root
#   python -m curriculum.auto_harness_search \
#     --config curriculum/configs/auto_harness_minestudio_gemini_probe.yaml

seed: 1
logdir: curriculum/outputs/auto_harness_minestudio_gemini_probe
n_rounds: 4
n_eval_episodes: 1
accept_eps: 0.005
start: strong
backend: minestudio
vla_mode: gemini-flash
vla_model_path: gemini-2.5-flash
gemini_temperature: 0.3
action_chunk_len: 4
max_steps: 16
ticks_per_action: 4
checkpoint_every: 4
recover_max_retries: 2
probe_budget: 6
probe_every_n: 2
probe_action_pool:
  - forward
  - attack
  - forward_attack
  - turn_left
  - look_up
mutation_components:
  - probe
  - memory
prefer_components:
  - probe
task_config: /path/to/openha_tasks/0000_mine_block_oak_log.json
img_save_dir: curriculum/outputs/harness_sandbox_images_gemini_probe
success_reward_thresh: 0.5
soft_rollback: true
