# Stage 3: Policy-aware WM adaptation + L_anchor
# ----------------------------------------------
# Small-step update of F under p_π(s), anchored to φ0, mixed with expert replay.

wm_backend: toy
toy_wm_ckpt: null
policy_ckpt: curriculum/outputs/stage2/policy_latest.pt
use_consistency_finetune: false
consistency_config: train/configs/action_consistency.yaml
consistency_logdir: logs/stage3_consistency

data_root: data/mc_vpt_long45
max_clips: 6
num_frame_per_block: 3
block_stride: 2

device: auto
policy_hidden: 256

expert_ratio: 0.5        # D = D_expert + D_policy
lambda_anchor: 1.0       # ||F_φ1 - F_φ0||²
lambda_expert: 0.5       # extra expert dynamics
collect_policy: 16
batch_size: 32

lr: 1.0e-4               # small step — do not full fine-tune
weight_decay: 0.01
max_grad_norm: 1.0

max_steps: 40
log_interval: 5
save_interval: 20
logdir: curriculum/outputs/stage3
