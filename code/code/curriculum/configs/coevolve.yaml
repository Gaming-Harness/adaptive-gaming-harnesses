# CoMAP-aligned co-evolution: Sandbox ↔ WM ↔ VLA
# -----------------------------------------------
# Warm-up checkpoints (optional):
#   toy_wm_ckpt / policy_ckpt from curriculum.pretrain_toy_wm + stage2
#
# Inner loop each step:
#   draft → WM imagine → future-aware reflect → collect on-policy
#   → update WM (L_dyn + self-distill + expert) + EMA teacher
#   → update π (PPO on real/imag mix)

wm_backend: toy
toy_wm_ckpt: curriculum/outputs/toy_wm0.pt
policy_ckpt: null

data_root: data/mc_vpt_long45
max_clips: 6
num_frame_per_block: 3
block_stride: 2

device: auto
policy_hidden: 256

# decision / reflection
reliability_temp: 2.0
reflect_rel_thresh: 0.3
dyn_reward_weight: 0.5

# replay
expert_ratio: 0.5
capacity_policy: 20000
capacity_imagined: 10000
collect_n: 16

# WM update (CoMAP self-distill analogue)
wm_lr: 1.0e-4
lambda_sd: 1.0          # student ↔ EMA teacher soft target
lambda_expert: 0.5
ema_tau: 0.99           # teacher ← student

# Policy update
pi_lr: 3.0e-4
real_ratio: 0.80
real_ratio_end: 0.55
clip_eps: 0.2
vf_coef: 0.5
ent_coef: 0.01

weight_decay: 0.01
max_grad_norm: 1.0
batch_size: 32

max_steps: 60
log_interval: 5
save_interval: 20
eval_n: 32
logdir: curriculum/outputs/coevolve
